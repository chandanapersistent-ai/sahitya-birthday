<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Sahitya</title>
<style>
  :root{
    --neon-blue:#3ec9ff;
    --neon-purple:#a06bff;
    --neon-pink:#ff5fc4;
    --gold:#ffd27a;
    --white-glow:#f4f7ff;
    --bg:#04040a;
    --bg-2:#0a0a18;
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.14);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior:smooth;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--bg);
    color:var(--white-glow);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  @font-face{
    font-family:'Playfair';
    src:local('Playfair Display');
  }

  /* ---------- background canvas ---------- */
  #bgCanvas{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:0; pointer-events:none;
  }
  .nebula{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 20% 15%, rgba(160,107,255,0.18), transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 25%, rgba(62,201,255,0.14), transparent 60%),
      radial-gradient(ellipse 55% 45% at 50% 90%, rgba(255,95,196,0.12), transparent 60%);
    animation: driftNebula 40s ease-in-out infinite alternate;
  }
  @keyframes driftNebula{
    0%{ transform: scale(1) translate(0,0); }
    100%{ transform: scale(1.08) translate(-1.5%, 1.5%); }
  }

  /* ---------- floating objects layer ---------- */
  #floatLayer{
    position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden;
  }
  .floater{
    position:absolute; will-change:transform, opacity;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.35));
    user-select:none;
  }

  /* ---------- sparkle trail / click hearts ---------- */
  #fxLayer{ position:fixed; inset:0; z-index:40; pointer-events:none; }
  .spark{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background: radial-gradient(circle, #fff, var(--neon-blue));
    box-shadow:0 0 10px var(--neon-blue);
    pointer-events:none;
  }
  .heart-pop{
    position:absolute; font-size:22px; pointer-events:none;
    text-shadow:0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
  }

  #fireworksCanvas{
    position:fixed; inset:0; z-index:35; pointer-events:none;
  }

  /* ---------- loading screen ---------- */
  #loading{
    position:fixed; inset:0; z-index:100;
    background:#000;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    transition: opacity 1.2s ease;
  }
  #loading.hide{ opacity:0; pointer-events:none; }
  #starsStatic{ position:absolute; inset:0; }
  .begin-btn{
    position:relative; z-index:2;
    padding:16px 38px;
    font-size:15px; letter-spacing:0.06em;
    color:var(--white-glow);
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:999px;
    backdrop-filter: blur(10px);
    cursor:pointer;
    box-shadow:0 0 24px rgba(160,107,255,0.35);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .begin-btn:hover{ transform:scale(1.04); box-shadow:0 0 36px rgba(160,107,255,0.55); }
  .begin-sub{
    position:relative; z-index:2; margin-top:18px; opacity:0.55; font-size:13px;
  }
  #countdownNum{
    position:relative; z-index:2;
    font-size:min(22vw, 160px);
    font-weight:200;
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(160,107,255,0.5);
    opacity:0;
  }

  /* ---------- layout ---------- */
  main{ position:relative; z-index:2; }
  section{
    position:relative;
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 64px 20px;
    text-align:center;
  }

  /* hero */
  #hero{ padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
  .photo-wrap{
    position:relative;
    width:min(62vw, 280px); height:min(62vw, 280px);
    margin-bottom:38px;
  }
  .ring{
    position:absolute; inset:-18px; border-radius:50%;
    border:1.5px solid transparent;
    background:
      linear-gradient(#000,#000) padding-box,
      conic-gradient(from 0deg, var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--gold), var(--neon-blue)) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spinRing 10s linear infinite;
    opacity:0.9;
  }
  .ring.r2{ inset:-34px; animation-duration:16s; animation-direction:reverse; opacity:0.5; }
  @keyframes spinRing{ to{ transform: rotate(360deg); } }
  .photo-frame{
    position:absolute; inset:0; border-radius:50%; overflow:hidden;
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.15),
      0 0 40px rgba(62,201,255,0.55),
      0 0 80px rgba(255,95,196,0.35),
      0 18px 50px rgba(0,0,0,0.6);
    animation: floatPhoto 6s ease-in-out infinite;
  }
  .photo-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes floatPhoto{
    0%,100%{ transform: translateY(0) rotate(-1.2deg); }
    50%{ transform: translateY(-14px) rotate(1.2deg); }
  }

  h1.headline{
    font-size: clamp(30px, 8vw, 64px);
    font-weight:600;
    line-height:1.12;
    margin:0 0 10px;
    background: linear-gradient(100deg, var(--white-glow) 0%, var(--neon-blue) 30%, var(--neon-purple) 55%, var(--neon-pink) 75%, var(--gold) 100%);
    background-size:220% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: glowPulse 3.2s ease-in-out infinite, sheen 7s linear infinite;
    text-wrap:balance;
  }
  @keyframes glowPulse{
    0%,100%{ filter: drop-shadow(0 0 14px rgba(160,107,255,0.35)); }
    50%{ filter: drop-shadow(0 0 30px rgba(255,95,196,0.55)); }
  }
  @keyframes sheen{ to{ background-position: -220% 0; } }
  .sub{ opacity:0.6; font-size:14px; letter-spacing:0.04em; margin-bottom:8px; }
  .scroll-hint{
    margin-top:54px; font-size:12px; opacity:0.45; letter-spacing:0.08em;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(8px);} }

  /* message */
  #message .card{
    max-width:560px; width:100%;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:22px; padding:34px 26px;
    backdrop-filter: blur(14px);
    box-shadow:0 0 40px rgba(62,201,255,0.12), inset 0 0 40px rgba(255,255,255,0.02);
  }
  #typedText{
    font-size:16px; line-height:1.85; text-align:left;
    white-space:pre-wrap; min-height:280px;
    color:#eef0ff;
  }
  .cursor{ display:inline-block; width:2px; height:1em; background:var(--neon-pink); vertical-align:-0.15em; animation:blink 0.9s step-end infinite; }
  @keyframes blink{ 50%{opacity:0;} }

  /* cake (pure CSS 3D) */
  .cake-scene{
    width:min(80vw, 320px); height:min(80vw, 320px);
    perspective: 900px;
    display:flex; align-items:flex-end; justify-content:center;
    margin: 10px 0 4px;
  }
  .cake{
    position:relative;
    width:220px; height:230px;
    transform-style:preserve-3d;
    animation: cakeSpin 9s linear infinite;
  }
  @keyframes cakeSpin{ from{ transform: rotateX(8deg) rotateY(0deg);} to{ transform: rotateX(8deg) rotateY(360deg);} }
  .tier{
    position:absolute; left:50%; bottom:0; transform-origin:center bottom;
    border-radius:50%/18%;
    box-shadow:
      inset 0 -10px 18px rgba(0,0,0,0.35),
      inset 0 10px 14px rgba(255,255,255,0.18),
      0 10px 24px rgba(0,0,0,0.55);
  }
  .tier::after{
    content:''; position:absolute; left:0; right:0; top:-3px; height:34%;
    border-radius:50%/60%;
    background:inherit; filter:brightness(1.18);
    opacity:0.9;
  }
  .tier1{
    width:210px; height:96px; margin-left:-105px; bottom:0;
    background: linear-gradient(180deg, #6b3f28, #3a2418);
    z-index:1;
  }
  .tier2{
    width:158px; height:88px; margin-left:-79px; bottom:78px;
    background: linear-gradient(180deg, #fff6ea, #f0dcc0);
    z-index:2;
  }
  .tier3{
    width:112px; height:76px; margin-left:-56px; bottom:150px;
    background: linear-gradient(180deg, #ffe0ef, #ffc3e0);
    z-index:3;
  }
  .drip{
    position:absolute; left:0; right:0; height:16px; border-radius:0 0 40% 40%/0 0 100% 100%;
    background: linear-gradient(180deg, var(--gold), transparent);
    opacity:0.85;
  }
  .tier2 .drip, .tier3 .drip{ top:8px; }
  .tier1 .drip{ top:10px; background: linear-gradient(180deg, #ffd27a, transparent); }
  .candles{
    position:absolute; left:50%; bottom:226px; width:0; height:0;
    transform-style:preserve-3d;
  }
  .candle{
    position:absolute; width:9px; height:46px; margin-left:-4.5px;
    border-radius:3px;
    background: repeating-linear-gradient(180deg, var(--neon-blue) 0 8px, #fff 8px 16px);
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }
  .candle:nth-child(odd){ background: repeating-linear-gradient(180deg, var(--neon-pink) 0 8px, #fff 8px 16px); }
  .flame{
    position:absolute; left:50%; top:-16px; width:12px; height:16px;
    margin-left:-6px;
    background: radial-gradient(circle at 50% 70%, #fff6cf 0%, var(--gold) 40%, #ff8a3d 75%, transparent 80%);
    border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
    opacity:0; transform-origin:50% 100%;
    filter: drop-shadow(0 0 8px #ffb347) drop-shadow(0 0 16px #ff8a3d);
    transition: opacity 0.4s ease;
  }
  .flame.lit{ opacity:1; animation: flicker 0.4s ease-in-out infinite alternate; }
  @keyframes flicker{
    0%{ transform: scaleY(1) rotate(-2deg); }
    100%{ transform: scaleY(1.12) rotate(2deg); }
  }
  .smoke{
    position:absolute; left:50%; top:-18px; width:6px; height:6px; margin-left:-3px;
    border-radius:50%; background:rgba(220,220,230,0.55);
    opacity:0; pointer-events:none;
  }
  .smoke.rise{
    animation: smokeRise 1.6s ease-out forwards;
  }
  @keyframes smokeRise{
    0%{ opacity:0.7; transform: translateY(0) scale(1); }
    100%{ opacity:0; transform: translateY(-46px) scale(2.4); }
  }
  .cake-caption{ margin-top:14px; opacity:0.55; font-size:13px; min-height:18px; }

  /* gifts */
  .gifts-row{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .gift{
    width:96px; height:96px; position:relative; cursor:pointer;
    perspective:600px;
  }
  .gift-box{
    position:absolute; inset:0; border-radius:14px;
    background: linear-gradient(145deg, var(--neon-purple), var(--neon-pink));
    box-shadow:0 0 26px rgba(255,95,196,0.4), 0 10px 24px rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    transition: transform .5s cubic-bezier(.2,1.4,.4,1), opacity .5s ease;
    animation: giftBob 3.6s ease-in-out infinite;
  }
  .gift:nth-child(2) .gift-box{ background:linear-gradient(145deg, var(--neon-blue), var(--neon-purple)); animation-delay:.3s; }
  .gift:nth-child(3) .gift-box{ background:linear-gradient(145deg, var(--gold), var(--neon-pink)); animation-delay:.6s; }
  @keyframes giftBob{ 0%,100%{ transform: translateY(0) rotate(-2deg);} 50%{ transform: translateY(-10px) rotate(2deg);} }
  .gift-box::before, .gift-box::after{
    content:''; position:absolute; background:rgba(255,255,255,0.85);
  }
  .gift-box::before{ width:14px; height:100%; left:50%; transform:translateX(-50%); }
  .gift-box::after{ width:100%; height:14px; top:50%; transform:translateY(-50%); }
  .gift.opened .gift-box{ transform: scale(0.2) rotate(25deg); opacity:0; }
  .gift-reveal{
    position:absolute; left:50%; bottom:110%;
    transform: translate(-50%, 10px) scale(0.85);
    width:200px; max-width:60vw;
    padding:12px 14px; border-radius:14px;
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter: blur(12px);
    box-shadow:0 0 28px rgba(255,95,196,0.35);
    font-size:13px; line-height:1.4; text-align:center;
    opacity:0; pointer-events:none;
    transition: opacity .5s ease, transform .5s cubic-bezier(.2,1.4,.4,1);
    z-index:5;
  }
  .gift-reveal.show{ opacity:1; transform: translate(-50%, 0) scale(1); }

  /* buttons */
  .btn-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:30px; }
  .glass-btn{
    padding:13px 22px; border-radius:999px; cursor:pointer;
    background:var(--panel); border:1px solid var(--panel-border);
    color:var(--white-glow); font-size:14px;
    backdrop-filter: blur(10px);
    box-shadow:0 4px 18px rgba(0,0,0,0.35);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .glass-btn:hover{ transform: translateY(-3px) scale(1.03); border-color:rgba(255,255,255,0.4); box-shadow:0 10px 30px rgba(160,107,255,0.35); }
  .glass-btn:active{ transform: translateY(0) scale(0.98); }

  /* music dock */
  #musicDock{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    z-index:60;
    display:flex; align-items:center; gap:10px;
    padding:10px 16px; border-radius:999px;
    background:rgba(10,10,20,0.55); border:1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    box-shadow:0 8px 26px rgba(0,0,0,0.45);
  }
  #musicDock button{
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    color:#0a0a12; font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  #musicDock input[type=range]{ width:70px; accent-color: var(--neon-pink); }

  /* final scene */
  #finale{ overflow:hidden; }
  .neon-heart{
    position:absolute; width:260px; height:230px; z-index:0; opacity:0.9;
    filter: drop-shadow(0 0 30px var(--neon-pink)) drop-shadow(0 0 60px var(--neon-purple));
  }
  .made-with-love{
    position:relative; z-index:2;
    font-size:clamp(18px,4.4vw,26px);
    letter-spacing:0.02em; opacity:0.92;
    margin-top:18px;
  }

  footer{
    position:relative; z-index:2;
    text-align:center; padding:40px 20px calc(120px + env(safe-area-inset-bottom, 0px));
    opacity:0.3; font-size:12px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; animation-iteration-count:1 !important; transition-duration:0.001s !important; }
  }

  ::selection{ background: var(--neon-pink); color:#000; }
  a{ color:inherit; }

  :focus-visible{ outline:2px solid var(--neon-blue); outline-offset:3px; }
</style>
</head>

<div class="nebula"></div>
<div id="floatLayer"></div>
<canvas id="fireworksCanvas"></canvas>

  /* ---------------- starfield (background, persistent) ---------------- */
  function makeStarfield(canvasId, opts){
    var canvas = document.getElementById(canvasId);
    var ctx = canvas.getContext('2d');
    var w,h,stars=[];
    var count = opts && opts.count || 160;
    function resize(){
      w = canvas.width = window.innerWidth * (window.devicePixelRatio||1);
      h = canvas.height = window.innerHeight * (window.devicePixelRatio||1);
      canvas.style.width = window.innerWidth+'px';
      canvas.style.height = window.innerHeight+'px';
      stars = [];
      for(var i=0;i<count;i++){
        stars.push({
          x: Math.random()*w, y: Math.random()*h,
          r: Math.random()*1.6+0.3,
          tw: Math.random()*Math.PI*2,
          speed: Math.random()*0.02+0.008,
          hue: Math.random() < 0.15
        });
      }
    }
    window.addEventListener('resize', resize);
    resize();
    var t=0;
    function draw(){
      ctx.clearRect(0,0,w,h);
      for(var i=0;i<stars.length;i++){
        var s = stars[i];
        var alpha = 0.35 + 0.65*Math.abs(Math.sin(s.tw + t*s.speed*40));
        ctx.beginPath();
        ctx.fillStyle = s.hue ? 'rgba(200,180,255,'+alpha+')' : 'rgba(255,255,255,'+alpha+')';
        ctx.arc(s.x, s.y, s.r*(window.devicePixelRatio||1), 0, Math.PI*2);
        ctx.fill();
      }
      t += 0.5;
      if(!reduceMotion) requestAnimationFrame(draw);
    }
    draw();
    return {resize:resize};
  }
  makeStarfield('bgCanvas', {count:170});
  makeStarfield('starsStatic', {count:120});

  /* ---------------- floating emoji objects ---------------- */
  var floatLayer = document.getElementById('floatLayer');
  var emojis = ['❤️','🎈','✨','🦋','⭐','💎'];
  function spawnFloater(){
    var el = document.createElement('div');
    el.className = 'floater';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    var size = 14 + Math.random()*20;
    var startX = Math.random()*100;
    var duration = 10 + Math.random()*10;
    var drift = (Math.random()*2-1)*60;
    el.style.left = startX+'vw';
    el.style.top = '105vh';
    el.style.fontSize = size+'px';
    el.style.opacity = 0.55 + Math.random()*0.4;
    floatLayer.appendChild(el);
    if(el.animate && !reduceMotion){
      var anim = el.animate([
        { transform:'translate(0,0) rotate(0deg)', offset:0 },
        { transform:'translate('+drift+'px,-115vh) rotate('+(Math.random()<0.5?-1:1)*180+'deg)', offset:1 }
      ], { duration: duration*1000, easing:'linear' });
      anim.onfinish = function(){ el.remove(); };
    } else {
      setTimeout(function(){ el.remove(); }, 500);
    }
  }
  var floatTimer = setInterval(function(){
    if(document.hidden) return;
    spawnFloater();
  }, reduceMotion ? 4000 : 900);

  /* ---------------- fireworks / confetti canvas ---------------- */
  var fwCanvas = document.getElementById('fireworksCanvas');
  var fctx = fwCanvas.getContext('2d');
  var fwParticles = [];
  function resizeFW(){
    fwCanvas.width = window.innerWidth * (window.devicePixelRatio||1);
    fwCanvas.height = window.innerHeight * (window.devicePixelRatio||1);
    fwCanvas.style.width = window.innerWidth+'px';
    fwCanvas.style.height = window.innerHeight+'px';
  }
  window.addEventListener('resize', resizeFW);
  resizeFW();

  var palette = ['#3ec9ff','#a06bff','#ff5fc4','#ffd27a','#ffffff'];

  function burstFirework(x, y, count, power){
    count = count || 60; power = power || 1;
    var color = palette[Math.floor(Math.random()*palette.length)];
    for(var i=0;i<count;i++){
      var angle = (Math.PI*2) * (i/count) + Math.random()*0.2;
      var speed = (2 + Math.random()*4) * power * (window.devicePixelRatio||1);
      fwParticles.push({
        x:x, y:y,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
        life: 1, decay: 0.008 + Math.random()*0.012,
        color: Math.random()<0.3 ? palette[Math.floor(Math.random()*palette.length)] : color,
        size: (1.5+Math.random()*2.2) * (window.devicePixelRatio||1),
        gravity: 0.02 * (window.devicePixelRatio||1)
      });
    }
  }
  function confettiBurst(x,y,count){
    count = count || 50;
    for(var i=0;i<count;i++){
      var angle = Math.random()*Math.PI*2;
      var speed = (1+Math.random()*5) * (window.devicePixelRatio||1);
      fwParticles.push({
        x:x, y:y,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 2,
        life:1, decay: 0.006+Math.random()*0.01,
        color: palette[Math.floor(Math.random()*palette.length)],
        size:(2+Math.random()*2.5)*(window.devicePixelRatio||1),
        gravity: 0.05*(window.devicePixelRatio||1),
        confetti:true, rot: Math.random()*Math.PI, rotSpeed:(Math.random()-0.5)*0.3
      });
    }
  }
  function fwLoop(){
    fctx.clearRect(0,0,fwCanvas.width, fwCanvas.height);
    for(var i=fwParticles.length-1;i>=0;i--){
      var p = fwParticles[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.life -= p.decay;
      if(p.life<=0){ fwParticles.splice(i,1); continue; }
      fctx.globalAlpha = Math.max(p.life,0);
      if(p.confetti){
        p.rot += p.rotSpeed;
        fctx.save();
        fctx.translate(p.x,p.y); fctx.rotate(p.rot);
        fctx.fillStyle = p.color;
        fctx.fillRect(-p.size, -p.size*0.5, p.size*2, p.size);
        fctx.restore();
      } else {
        fctx.beginPath();
        fctx.fillStyle = p.color;
        fctx.shadowColor = p.color; fctx.shadowBlur = 8*(window.devicePixelRatio||1);
        fctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        fctx.fill();
      }
    }
    fctx.globalAlpha = 1;
    fctx.shadowBlur = 0;
    requestAnimationFrame(fwLoop);
  }
  fwLoop();

  function randomBurstOnScreen(){
    var dpr = window.devicePixelRatio||1;
    burstFirework(Math.random()*fwCanvas.width, fwCanvas.height*(0.15+Math.random()*0.4), 70, 1);
  }
  function fireworksFinale(n){
    n = n || 6;
    for(var i=0;i<n;i++){
      setTimeout(randomBurstOnScreen, i*260);
    }
  }

  /* ---------------- interactive: click hearts / sparkle trail / hold ---------------- */
  var fxLayer = document.getElementById('fxLayer');
  function popHeart(x,y){
    var h = document.createElement('div');
    h.className = 'heart-pop';
    h.textContent = '❤️';
    h.style.left = x+'px'; h.style.top = y+'px';
    fxLayer.appendChild(h);
    if(h.animate && !reduceMotion){
      var a = h.animate([
        {transform:'translate(-50%,-50%) scale(0.6)', opacity:1},
        {transform:'translate(-50%,-160%) scale(1.3)', opacity:0}
      ], {duration:900, easing:'ease-out'});
      a.onfinish = function(){ h.remove(); };
    } else { setTimeout(function(){h.remove();}, 900); }
  }
  var lastTrail = 0;
  document.addEventListener('pointermove', function(e){
    var now = performance.now();
    if(now - lastTrail < 40) return;
    lastTrail = now;
    if(reduceMotion) return;
    var s = document.createElement('div');
    s.className = 'spark';
    s.style.left = e.clientX+'px'; s.style.top = e.clientY+'px';
    fxLayer.appendChild(s);
    var a = s.animate([
      {transform:'translate(-50%,-50%) scale(1)', opacity:1},
      {transform:'translate(-50%,-50%) scale(0.2)', opacity:0}
    ], {duration:600, easing:'ease-out'});
    a.onfinish = function(){ s.remove(); };
  }, {passive:true});

  document.addEventListener('click', function(e){
    if(e.target.closest('button')) return;
    popHeart(e.clientX, e.clientY);
  });
  document.addEventListener('dblclick', function(e){
    burstFirework(e.clientX*(window.devicePixelRatio||1), e.clientY*(window.devicePixelRatio||1), 90, 1.3);
  });

  var holdTimer=null;
  function startHold(x,y){
    holdTimer = setTimeout(function(){
      confettiBurst(x*(window.devicePixelRatio||1), y*(window.devicePixelRatio||1), 70);
    }, 550);
  }
  function endHold(){ clearTimeout(holdTimer); }
  document.addEventListener('pointerdown', function(e){ startHold(e.clientX, e.clientY); });
  document.addEventListener('pointerup', endHold);
  document.addEventListener('pointercancel', endHold);

  /* shake detection (mobile) -> balloons burst into hearts */
  var lastShake = 0, lastAcc = null;
  window.addEventListener('devicemotion', function(e){
    var acc = e.accelerationIncludingGravity;
    if(!acc) return;
    var now = Date.now();
    if(lastAcc && now - lastShake > 1200){
      var delta = Math.abs(acc.x-lastAcc.x)+Math.abs(acc.y-lastAcc.y)+Math.abs(acc.z-lastAcc.z);
      if(delta > 28){
        lastShake = now;
        for(var i=0;i<10;i++){
          setTimeout(function(){ popHeart(Math.random()*window.innerWidth, Math.random()*window.innerHeight*0.6+80); }, i*80);
        }
      }
    }
    lastAcc = {x:acc.x,y:acc.y,z:acc.z};
  });

  /* ---------------- typing message ---------------- */
  var message = "Happy Birthday, Sahitya ❤️\n\nToday is your special day, and I hope it brings you endless happiness, love, success, good health, and unforgettable memories.\n\nMay every dream you have come true, and may your smile always shine as brightly as these lights.\n\nThank you for being such a wonderful person.\n\nI wish you endless happiness, peace, success, laughter, love, and beautiful moments every single day.\n\nMay this birthday mark the beginning of the best chapter of your life.\n\nAlways keep smiling and shining.\n\nHappy Birthday once again ❤️🎂";
  var typedEl = document.getElementById('typedText');
  var typedStarted = false;
  function typeMessage(){
    if(typedStarted) return;
    typedStarted = true;
    var i = 0;
    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    if(reduceMotion){ typedEl.textContent = message; return; }
    function step(){
      i++;
      typedEl.textContent = message.slice(0,i);
      typedEl.appendChild(cursor);
      if(i < message.length){
        setTimeout(step, 16 + Math.random()*22);
      }
    }
    step();
  }
  var msgObs = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting) typeMessage(); });
  }, {threshold:0.4});
  msgObs.observe(document.getElementById('message'));

  /* ---------------- 3D cake (pure CSS — no external deps, always renders) ---------------- */
  function initCake(){
    var cakeEl = document.getElementById('cake3d');
    var holder = document.getElementById('candleHolder');
    if(!cakeEl || !holder) return;
    var candleCount = 5;
    var radius = 34;
    var candles = [];
    for(var i=0;i<candleCount;i++){
      var ang = (i/candleCount)*Math.PI*2 - Math.PI/2;
      var cx = Math.cos(ang)*radius;
      var candle = document.createElement('div');
      candle.className = 'candle';
      candle.style.left = 'calc(50% + ' + cx + 'px)';
      var flame = document.createElement('div');
      flame.className = 'flame';
      candle.appendChild(flame);
      holder.appendChild(candle);
      candles.push(flame);
    }

    var lit = false, blownOut = false;
    var caption = document.getElementById('cakeCaption');

    function lightCandles(){
      lit = true;
      candles.forEach(function(f, idx){
        setTimeout(function(){ f.classList.add('lit'); }, idx*180);
      });
      caption.textContent = 'make a wish… 🎂✨';
      setTimeout(blowOutCandles, 4200);
    }

    function blowOutCandles(){
      if(blownOut) return;
      blownOut = true;
      candles.forEach(function(f, idx){
        setTimeout(function(){
          f.classList.remove('lit');
          var smoke = document.createElement('div');
          smoke.className = 'smoke';
          f.parentNode.appendChild(smoke);
          requestAnimationFrame(function(){ smoke.classList.add('rise'); });
          setTimeout(function(){ smoke.remove(); }, 1700);
        }, idx*100);
      });
      caption.textContent = 'wish made ✨ happy birthday!';
      var rect = cakeEl.getBoundingClientRect();
      var dpr = window.devicePixelRatio||1;
      burstFirework((rect.left+rect.width/2)*dpr, rect.top*dpr, 90, 1.1);
    }

    var cakeObs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting && !lit) lightCandles();
      });
    }, {threshold:0.4});
    cakeObs.observe(cakeEl);
  }

  /* ---------------- gift boxes ---------------- */
  document.querySelectorAll('.gift').forEach(function(g){
    g.addEventListener('click', function(){
      if(g.classList.contains('opened')) return;
      g.classList.add('opened');
      var rect = g.getBoundingClientRect();
      confettiBurst((rect.left+rect.width/2)*(window.devicePixelRatio||1), (rect.top+rect.height/2)*(window.devicePixelRatio||1), 55);
      burstFirework((rect.left+rect.width/2)*(window.devicePixelRatio||1), (rect.top)*(window.devicePixelRatio||1), 35, 0.7);
      var reveal = g.querySelector('.gift-reveal');
      if(reveal){
        reveal.textContent = g.getAttribute('data-msg') || '';
        setTimeout(function(){ reveal.classList.add('show'); }, 250);
      }
    });
  });

  /* ---------------- buttons ---------------- */
  document.getElementById('btnFireworks').addEventListener('click', function(){ fireworksFinale(6); });
  document.getElementById('btnCelebrate').addEventListener('click', function(){ fireworksFinale(8); playMelody(); });
  document.getElementById('btnLove').addEventListener('click', function(e){
    for(var i=0;i<8;i++){
      setTimeout(function(){
        popHeart(window.innerWidth/2 + (Math.random()-0.5)*140, window.innerHeight*0.6 + (Math.random()-0.5)*80);
      }, i*70);
    }
  });
  document.getElementById('btnSurprise').addEventListener('click', function(){
    var actions = [
      function(){ fireworksFinale(4); },
      function(){ confettiBurst(fwCanvas.width/2, fwCanvas.height*0.3, 90); },
      function(){ for(var i=0;i<10;i++) setTimeout(function(){ popHeart(Math.random()*window.innerWidth, Math.random()*window.innerHeight); }, i*60); }
    ];
    actions[Math.floor(Math.random()*actions.length)]();
  });

  /* ---------------- finale trigger ---------------- */
  var finaleObs = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        fireworksFinale(7);
        finaleObs.disconnect();
      }
    });
  }, {threshold:0.5});
  finaleObs.observe(document.getElementById('finale'));

  /* ---------------- music: synthesized ambient + melody (Web Audio) ---------------- */
  var audioCtx = null, musicGain = null, playing = false, muted = false, ambientNodes = [];
  function ensureAudio(){
    if(audioCtx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.55 * 0.55;
    musicGain.connect(audioCtx.destination);
  }
  function startAmbient(){
    if(!audioCtx) return;
    var notes = [261.63, 329.63, 392.00, 523.25];
    notes.forEach(function(freq, i){
      var osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var g = audioCtx.createGain();
      g.gain.value = 0.022;
      var lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.08 + i*0.02;
      var lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 0.015;
      lfo.connect(lfoGain); lfoGain.connect(g.gain);
      osc.connect(g); g.connect(musicGain);
      osc.start(); lfo.start();
      ambientNodes.push(osc, lfo, g, lfoGain);
    });
  }

  /* "Happy Birthday to You" (traditional melody, public domain) — synthesized, no audio file needed */
  var NOTE = {
    C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
    C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99
  };
  var HBD_TEMPO = 108; // bpm
  var HBD_MELODY = [
    ['G4',0.5],['G4',0.5],['A4',1],['G4',1],['C5',1],['B4',2],
    ['G4',0.5],['G4',0.5],['A4',1],['G4',1],['D5',1],['C5',2],
    ['G4',0.5],['G4',0.5],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
    ['F5',0.5],['F5',0.5],['E5',1],['C5',1],['D5',1],['C5',2]
  ];
  var hbdTimer = null, hbdWantsPlay = false;
  function playNote(freq, startTime, dur){
    var osc = audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value = freq;
    var osc2 = audioCtx.createOscillator(); osc2.type='triangle'; osc2.frequency.value = freq; osc2.detune.value = 5;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(0.17, startTime+0.035);
    g.gain.exponentialRampToValueAtTime(0.0008, startTime+dur);
    osc.connect(g); osc2.connect(g); g.connect(musicGain);
    osc.start(startTime); osc.stop(startTime+dur+0.05);
    osc2.start(startTime); osc2.stop(startTime+dur+0.05);
  }
  function scheduleHappyBirthday(delay){
    if(!audioCtx) return;
    clearTimeout(hbdTimer);
    var beatSec = 60/HBD_TEMPO;
    var t = audioCtx.currentTime + (delay||0.15);
    var start = t;
    HBD_MELODY.forEach(function(n){
      var dur = n[1]*beatSec;
      playNote(NOTE[n[0]], t, dur*0.9);
      t += dur;
    });
    var totalDur = t - start;
    hbdTimer = setTimeout(function(){
      if(hbdWantsPlay) scheduleHappyBirthday(0.5);
    }, (totalDur + 1.4) * 1000);
  }
  function playMelody(){
    ensureAudio();
    if(ambientNodes.length===0) startAmbient();
    scheduleHappyBirthday(0.05);
  }
  var btnPlayPause = document.getElementById('btnPlayPause');
  var btnMute = document.getElementById('btnMute');
  var volSlider = document.getElementById('volSlider');
  function setPlaying(p){
    playing = p;
    hbdWantsPlay = p;
    btnPlayPause.textContent = playing ? '⏸' : '▶';
    if(audioCtx){
      if(playing){
        audioCtx.resume();
        if(ambientNodes.length===0) startAmbient();
        scheduleHappyBirthday(0.2);
      } else {
        audioCtx.suspend();
        clearTimeout(hbdTimer);
      }
    }
  }
  btnPlayPause.addEventListener('click', function(){
    ensureAudio();
    setPlaying(!playing);
  });
  btnMute.addEventListener('click', function(){
    muted = !muted;
    btnMute.textContent = muted ? '🔇' : '🔊';
    if(musicGain) musicGain.gain.value = muted ? 0 : (volSlider.value/100)*0.55;
  });
  volSlider.addEventListener('input', function(){
    if(musicGain && !muted) musicGain.gain.value = (volSlider.value/100)*0.55;
  });

  /* ---------------- voice note ---------------- */
  var voiceNote = document.getElementById('voiceNote');
  var voiceUnlocked = false;
  function unlockVoiceNote(){
    if(voiceUnlocked) return;
    voiceUnlocked = true;
    voiceNote.volume = 0.001;
    var p = voiceNote.play();
    if(p && p.catch){
      p.then(function(){ voiceNote.pause(); voiceNote.currentTime = 0; voiceNote.volume = 1; })
       .catch(function(){ voiceNote.volume = 1; });
    }
  }
  function playVoiceNote(){
    ensureAudio();
    if(musicGain && audioCtx) musicGain.gain.setTargetAtTime(0.04, audioCtx.currentTime, 0.3);
    voiceNote.currentTime = 0;
    voiceNote.play().catch(function(){});
  }
  voiceNote.addEventListener('ended', function(){
    if(musicGain && audioCtx && !muted) musicGain.gain.setTargetAtTime((volSlider.value/100)*0.55, audioCtx.currentTime, 0.6);
  });
  document.getElementById('btnVoice').addEventListener('click', playVoiceNote);

  /* ---------------- loading sequence ---------------- */
  var loading = document.getElementById('loading');
  var beginBtn = document.getElementById('beginBtn');
  var countdownNum = document.getElementById('countdownNum');
  beginBtn.addEventListener('click', function(){
    ensureAudio();
    startAmbient();
    setPlaying(true);
    unlockVoiceNote();
    beginBtn.style.display='none';
    document.querySelector('.begin-sub').style.display='none';
    runCountdown();
  });
  function runCountdown(){
    var n = 3;
    countdownNum.style.opacity = 1;
    countdownNum.textContent = n;
    var iv = setInterval(function(){
      n--;
      if(n>0){
        countdownNum.textContent = n;
      } else {
        clearInterval(iv);
        countdownNum.style.opacity = 0;
        fireworksFinale(8);
        setTimeout(function(){
          loading.classList.add('hide');
          setTimeout(function(){ loading.remove(); }, 1300);
          initCake();
          setTimeout(playVoiceNote, 1200);
        }, 500);
      }
    }, 800);
  }

})();
</script>
</body>
</html>
